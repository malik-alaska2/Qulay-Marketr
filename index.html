<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qulay Market</title>
<meta name="description" content="Uy-joy e'lonlari va transfer / taksi xizmati. Brauzerda ham, Telegram ichida ham ochiladi.">
<meta name="theme-color" content="#FE5857">
<meta property="og:type" content="website">
<meta property="og:title" content="Qulay Market">
<meta property="og:description" content="Uy-joy e'lonlari va transfer / taksi xizmati">
<meta property="og:image" content="logo.png">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --brand:#FE5857; --accent:#EA3B38; --accent-2:#C92F2C; --accent-soft:#FFEDEC;
    --bg:#FAFAFA; --card:#FFFFFF; --line:#ECECEE; --text:#111318; --muted:#6E7278;
    --ink:#111318; --danger:#C92F2C;
    --r:16px; --shadow:0 1px 2px rgba(17,19,24,.05),0 6px 18px rgba(17,19,24,.04);
  }
  [data-theme="dark"]{
    --brand:#FE5857; --accent:#FE5857; --accent-2:#E8433F; --accent-soft:#2A1717;
    --bg:#0C0D10; --card:#16181D; --line:#24272E; --text:#F4F5F7; --muted:#9AA0A8;
    --ink:#F4F5F7; --danger:#FF6B67;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{max-width:100%;overflow-x:clip}
  body{background:var(--bg);color:var(--text);font-family:"Open Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  a{color:inherit;text-decoration:none}
  svg{display:block}
  input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none;
    transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  textarea{resize:vertical}
  .wrap{max-width:840px;margin:0 auto;
    padding:0 max(15px,env(safe-area-inset-right)) calc(74px + env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left))}

  /* Shapka */
  .header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
    background:color-mix(in srgb,var(--bg) 84%,transparent);border-bottom:1px solid transparent;transition:border-color .2s}
  .header.scrolled{border-bottom-color:var(--line)}
  .header-in{max-width:840px;margin:0 auto;padding:10px 15px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;flex:1;user-select:none;cursor:pointer}
  .brand img{width:30px;height:30px;object-fit:contain}
  .brand span{font-size:18px;font-weight:800;letter-spacing:-.4px}
  .brand span i{color:var(--brand);font-style:normal}
  .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
  .icon-btn:active{transform:scale(.94)}
  /* Til almashtirgich */
  .lang{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--card);
    border:1px solid var(--line);flex-shrink:0}
  .lang button{padding:6px 9px;border-radius:9px;font-size:11.5px;font-weight:800;
    letter-spacing:.4px;color:var(--muted);line-height:1;transition:.15s}
  .lang button.on{background:var(--ink);color:var(--bg)}
  .lang button:active{transform:scale(.94)}

  /* Qidiruv va filtrlar */
  .search{position:relative;margin:10px 0}
  .search input{padding-left:42px;border-radius:14px}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .toolbar{display:flex;align-items:center;gap:10px;margin:10px 2px 12px}
  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:1px 0}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);
    font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.15s}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .sortbtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
  .count{font-size:12.5px;color:var(--muted);margin:0 2px 10px}

  /* Kartochkalar */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;position:relative;transition:transform .12s}
  .card:active{transform:scale(.985)}
  .thumb{aspect-ratio:4/3;background:linear-gradient(140deg,var(--accent-soft),var(--card));position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--brand);opacity:.5}
  .card-b{padding:11px 12px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
  .price{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .price small{font-size:11.5px;font-weight:600;color:var(--muted)}
  .ttl{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .specs{font-size:11.5px;color:var(--muted);margin-top:auto;padding-top:4px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .fav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:99px;z-index:2;
    background:color-mix(in srgb,var(--card) 90%,transparent);color:var(--muted);
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .fav.on{color:var(--brand)}
  .tag{position:absolute;top:8px;left:8px;z-index:2;background:var(--ink);color:var(--bg);
    font-size:10px;font-weight:700;letter-spacing:.3px;padding:4px 9px;border-radius:99px;text-transform:uppercase}
  .tag.red{background:var(--brand);color:#fff}

  .sk{border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden}
  .sk .b{aspect-ratio:4/3;background:var(--line);animation:pulse 1.3s ease-in-out infinite}
  .sk .l{height:11px;margin:11px 12px;border-radius:6px;background:var(--line);animation:pulse 1.3s ease-in-out infinite}
  .sk .l.s{width:55%}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:.95}}

  /* Pozitsiya sahifasi */
  .back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--muted);padding:12px 0}
  .gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r)}
  .gallery::-webkit-scrollbar{display:none}
  .gallery img{scroll-snap-align:center;flex:0 0 100%;height:min(62vw,330px);object-fit:cover;border-radius:var(--r);background:var(--accent-soft)}
  .hero-none{height:190px;border-radius:var(--r);background:linear-gradient(140deg,var(--accent-soft),var(--card));
    display:flex;align-items:center;justify-content:center;color:var(--brand);opacity:.6}
  .dots{display:flex;gap:5px;justify-content:center;margin-top:9px}
  .dots i{width:6px;height:6px;border-radius:99px;background:var(--line)}
  .dots i.on{background:var(--brand);width:16px;transition:width .2s}
  .name-row{display:flex;align-items:flex-start;gap:12px;margin:16px 0 6px}
  h1.name{font-size:21px;font-weight:800;letter-spacing:-.4px;flex:1;line-height:1.3}
  .star{width:42px;height:42px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);
    color:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .star.on{color:var(--brand);border-color:var(--brand);background:var(--accent-soft)}
  .big-price{font-size:25px;font-weight:800;letter-spacing:-.6px}
  .big-price small{font-size:14px;font-weight:600;color:var(--muted)}
  .specs-list{margin:16px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:0 14px;box-shadow:var(--shadow)}
  .specs-list div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;font-size:14px;border-top:1px solid var(--line)}
  .specs-list div:first-child{border-top:none}
  .specs-list dt{color:var(--muted)}
  .specs-list dd{font-weight:600;text-align:right}
  .desc{white-space:pre-line;font-size:14.5px;line-height:1.65;margin:16px 0}
  h2.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 10px}

  .btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:14px;
    border-radius:13px;font-size:15px;font-weight:700;text-align:center;transition:.15s}
  .btn:active{transform:scale(.985);opacity:.9}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
  .btn-dark{background:var(--ink);color:var(--bg)}
  .btn-soft{background:var(--accent-soft);color:var(--accent)}
  .btn-line{border:1.5px solid var(--line);background:var(--card)}
  .btn-danger{background:var(--accent-soft);color:var(--danger)}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .cta{margin:24px 0 8px;display:flex;flex-direction:column;gap:9px}

  .amen{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .amen span{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;box-shadow:var(--shadow)}
  .amen span svg{color:var(--brand);flex-shrink:0}
  .cta-box{margin:13px 0 6px;padding:13px 13px 12px;border:1px solid var(--line);border-radius:var(--r);
    background:var(--card);box-shadow:var(--shadow)}
  .cta-box .cta-t{font-size:15px;font-weight:800;letter-spacing:-.2px;margin-bottom:3px}
  .cta-box .cta-s{font-size:12.5px;line-height:1.45;color:var(--muted);margin-bottom:10px}
  .cta-box .cta{margin:0;gap:8px}

  /* Pastki menyu */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--card) 94%,transparent);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);
    display:flex;max-width:840px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;padding:9px 0 10px;font-size:10.5px;font-weight:700;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  .nav button.on{color:var(--brand)}
  .nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
  .nav .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;
    border-radius:99px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:800;
    display:flex;align-items:center;justify-content:center}

  .page{display:none;animation:fade .18s ease}
  .page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h2.title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:16px 0 12px}
  .empty{text-align:center;padding:54px 20px;color:var(--muted);font-size:14px}
  .empty svg{margin:0 auto 14px;color:var(--line)}
  .muted{color:var(--muted);font-size:13px;line-height:1.6}

  .toast{position:fixed;left:50%;top:14px;z-index:99;transform:translateX(-50%) translateY(-130px);
    background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:13.5px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.28);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:92vw;text-align:center}
  .toast.on{transform:translateX(-50%) translateY(0)}

  /* Boshqaruv paneli */
  .lock{max-width:360px;margin:28px auto 0;text-align:center}
  .lock img{width:170px;margin:0 auto 22px;display:block}
  .lock img.dark{display:none}
  [data-theme="dark"] .lock img.light{display:none}
  [data-theme="dark"] .lock img.dark{display:block}
  .lock .f{text-align:left}
  .adm{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
  .adm-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px}
  .adm-head{display:flex;align-items:center;gap:11px;cursor:pointer}
  .adm-head .g{flex:1;min-width:0}
  .adm-head b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .adm-head .mini{width:48px;height:48px;border-radius:11px;object-fit:cover;background:var(--accent-soft);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:var(--brand)}
  .adm-body{margin-top:13px;display:flex;flex-direction:column;gap:11px}
  .f label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--muted)}
  .f{min-width:0}
  .f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px;align-items:start}
  .f2 input,.f2 select,.f2 textarea{min-width:0;max-width:100%}
  /* Sana va vaqt: iOS bu maydonlarni o'zicha kengaytirib, ustunni siqib qo'yadi — o'lchamni qat'iy qilamiz */
  input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;
    min-width:0;max-width:100%;height:48px;line-height:22px;text-align:left}
  input[type=date]::-webkit-date-and-time-value,
  input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:22px}
  input[type=date]::-webkit-datetime-edit,
  input[type=time]::-webkit-datetime-edit{padding:0;line-height:22px}
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator{opacity:.45;padding:0;margin:0 0 0 6px}
  .dt{position:relative;min-width:0}
  .dt .ph{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;
    color:var(--muted);font-size:15px}
  .dt.filled .ph{display:none}
  .dt:not(.filled) input::-webkit-datetime-edit{opacity:0}
  @media (max-width:340px){.f2{gap:8px}.dt .ph{font-size:13.5px;left:12px}}
  .checks{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}
  .checks label{display:flex;align-items:center;gap:8px}
  .checks input{width:20px;height:20px;padding:0;accent-color:var(--accent)}
  .photos{display:flex;flex-wrap:wrap;gap:9px}
  .photos figure{position:relative;width:80px}
  .photos img{width:80px;height:64px;object-fit:cover;border-radius:10px;background:var(--accent-soft)}
  .photos button{position:absolute;top:-6px;right:-6px;width:23px;height:23px;border-radius:99px;
    background:var(--danger);color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
  /* Transfer / taksi */

  .hero-tx{position:relative;overflow:hidden;border-radius:var(--r);padding:13px 14px 14px;margin:10px 0 10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 30%,transparent)}
  .hero-tx h1{font-size:18px;font-weight:800;letter-spacing:-.5px;margin-bottom:3px;position:relative}
  .hero-tx p{font-size:12.5px;line-height:1.45;opacity:.92;max-width:78%;position:relative;white-space:pre-line}
  .hero-tx .ill{position:absolute;right:-12px;bottom:-14px;opacity:.2;pointer-events:none}

  .route{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:2px 10px 2px 14px;box-shadow:var(--shadow)}
  .route .rows{flex:1;min-width:0}
  .rrow{position:relative;display:flex;align-items:center;gap:12px}
  .rrow + .rrow{border-top:1px solid var(--line)}
  .rrow .mk{flex:0 0 10px;width:10px;height:10px;position:relative;z-index:1}
  .rrow .mk.a{border-radius:99px;border:2.5px solid var(--brand)}
  .rrow .mk.m{border-radius:99px;background:var(--muted);transform:scale(.6)}
  .rrow .mk.b{border-radius:3px;background:var(--brand)}
  .rrow:not(:last-of-type)::before{content:"";position:absolute;left:4px;top:calc(50% + 9px);height:calc(100% - 18px);
    width:2px;background:repeating-linear-gradient(var(--line) 0 3px,transparent 3px 7px)}
  .rrow input{border:none;background:transparent;border-radius:0;padding:12px 0;font-size:15px;font-weight:600}
  .rrow input::placeholder{font-weight:400;color:var(--muted)}
  .rrow input::-webkit-calendar-picker-indicator{display:none!important}
  .rrow .rm{flex:0 0 28px;width:28px;height:28px;border-radius:99px;color:var(--muted);
    font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
  .rrow .rm:active{background:var(--accent-soft);color:var(--danger)}
  .route .swap{flex:0 0 40px;width:40px;height:40px;align-self:center;border-radius:99px;
    border:1px solid var(--line);background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center}
  .route .swap:active{transform:rotate(180deg);transition:transform .2s}
  .addstop{display:flex;align-items:center;gap:9px;width:100%;padding:10px 0;border-top:1px solid var(--line);
    color:var(--brand);font-size:12.5px;font-weight:700;text-align:left}
  .addstop:active{opacity:.6}
  .linkbtn{display:block;width:100%;padding:9px 0 2px;text-align:center;
    font-size:12.5px;font-weight:700;color:var(--muted)}
  .linkbtn:active{opacity:.6}
  .addnote{display:flex;align-items:center;gap:8px;width:100%;margin-top:9px;padding:11px 13px;
    border:1.5px dashed var(--line);border-radius:12px;background:var(--card);
    color:var(--muted);font-size:12.5px;font-weight:600;text-align:left}
  .addnote:active{border-color:var(--brand);color:var(--brand)}
  .tx-cta{margin:13px 0 0;gap:8px}
  .tx-foot{margin:8px 2px 0;text-align:center;font-size:11.5px;line-height:1.45;color:var(--muted)}

  .save-bar{position:sticky;bottom:calc(80px + env(safe-area-inset-bottom));padding:12px 0;z-index:25;
    background:linear-gradient(to top,var(--bg) 60%,transparent)}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10.2 12 3l9 7.2"/><path d="M5.5 9.2V20h13V9.2"/><path d="M9.8 20v-5.4h4.4V20"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.4 7.5h15.2L18.4 20H5.6z"/><path d="M8.6 7.5a3.4 3.4 0 0 1 6.8 0"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/></symbol>
  <symbol id="i-star-f" viewBox="0 0 24 24" fill="currentColor">
    <path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

const LANGS = ["uz", "ru"];

/* Til: manzildagi ?lang= → brauzer xotirasi → Telegram/brauzer tili → o'zbekcha */
function pickLang() {
  let q = "";
  try { q = (new URLSearchParams(location.search).get("lang") || "").toLowerCase(); } catch {}
  if (LANGS.includes(q)) { try { localStorage.setItem(K("lang"), q); } catch {} return q; }
  let saved = "";
  try { saved = localStorage.getItem(K("lang")) || ""; } catch {}
  if (LANGS.includes(saved)) return saved;
  let code = "";
  try {
    code = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code)
      || navigator.language || "").toLowerCase();
  } catch {}
  return /^(ru|be|uk|kk|ky|tg|tk)/.test(code) ? "ru" : "uz";
}
let LANG = pickLang();

/* Kalit bo'yicha matn. {n}, {title}, {id} kabi o'rinlar to'ldiriladi. */
function T(key, vars) {
  let out = (I18N[LANG] && I18N[LANG][key]) ?? I18N.uz[key] ?? key;
  if (vars) for (const k in vars) out = out.split("{" + k + "}").join(vars[k]);
  return out;
}

/* Ruscha son shakllari: 1 e'lon / 2 e'lon / 5 e'lon */
function plural(n, one, few, many) {
  const a = Math.abs(Number(n) || 0) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b === 1) return one;
  if (b >= 2 && b <= 4) return few;
  return many;
}

/* E'lonning tanlangan tildagi maydoni. Ruschasi bo'sh bo'lsa — o'zbekchasi. */
function L(it, key) {
  if (LANG === "ru" && it && it.ru) {
    const v = String(it.ru[key] ?? "").trim();
    if (v) return it.ru[key];
  }
  return it ? it[key] : "";
}

  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = T(el.dataset.i18nPh); });

  document.querySelectorAll("#langSw button").forEach((b) => b.classList.toggle("on", b.dataset.lang === LANG));
}

function setLang(next) {

}

const HASHES = { realty: "", product: "#mahsulot", taxi: "#transfer", fav: "#saralangan", admin: "#admin" };

function go(next, id) {
  if (next === "product" && !SHOW_PRODUCTS) next = "realty";
  if (next === "taxi" && !TRANSFER().on) next = "realty";
  page = next;
  if (next === "realty" || next === "product") { kind = next; cat = ""; }
  curItem = next === "item" ? Number(id) : null;

  document.querySelectorAll(".page").forEach((el) => el.classList.remove("on"));
  $(next === "realty" || next === "product" ? "p-list" : "p-" + next).classList.add("on");
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.page === next));

  const hash = next === "item" ? "#item-" + id : (HASHES[next] ?? "");
  if (location.hash !== hash) history.replaceState(null, "", location.pathname + location.search + hash);

  if (next === "realty" || next === "product") renderList();
  if (next === "taxi") renderTaxi();
  if (next === "fav") renderFavs();
  if (next === "item") renderItem();
  if (next === "admin") renderAdmin();

  window.scrollTo(0, 0);
  if (tg && tg.BackButton) { try { next === "item" ? tg.BackButton.show() : tg.BackButton.hide(); } catch {} }
}

/* Bo'lim nomi → sahifa. Telegram mini app manzilining # qismini o'zining
   ma'lumotlari bilan to'ldiradi, shuning uchun ?p=transfer ham qabul qilinadi. */
function routeKey(key) {
  const k = String(key || "");
  const m = k.match(/^item-(\d+)$/);
  if (m) return ["item", m[1]];
  if (k === "mahsulot") return [SHOW_PRODUCTS ? "product" : "realty"];
  if (k === "transfer") return ["taxi"];
  if (k === "saralangan") return ["fav"];
  if (k === "admin") return ["admin"];
  return null;
}

function routeFromHash() {
  let q = "";
  try { q = new URLSearchParams(location.search).get("p") || ""; } catch {}
  const r = routeKey(location.hash.replace(/^#/, "")) || routeKey(q);
  if (!r) return go("realty");
  if (r[0] === "admin") $("navAdmin").style.display = "flex";
  go(r[0], r[1]);
}

function visible() {
  const q = query.trim().toLowerCase();
  let list = ITEMS.filter((it) => {
    if (it.hidden) return false;
    if (it.kind !== kind) return false;
    if (!SHOW_PRODUCTS && !isRealty(it)) return false;
    if (cat && it.category !== cat) return false;
    if (!q) return true;
    const ru = it.ru || {};
    return [it.title, it.description, it.category, it.district, it.rooms, it.floor, it.address, it.transport,
            ru.title, ru.description, ru.category, ru.district, ru.floor, ru.address, ru.transport]
      .filter(Boolean).join(" ").toLowerCase().includes(q);
  });
  if (sort === 1) list = [...list].sort((a, b) => a.price - b.price);
  if (sort === 2) list = [...list].sort((a, b) => b.price - a.price);
  return list;
}

function renderChips() {

/* ============================================================ TRANSFER / TAKSI ============================================================ */
function txSet(field, value) { TX[field] = value; }
function txOpenNote() { TX.noteOpen = true; renderTaxi(); const el = $("txNote"); if (el) el.focus(); }

const TX_MAX_STOPS = 4;
function txSetStop(n, value) { TX.stops[n] = value; }
function txAddStop() {
  if (TX.stops.length >= TX_MAX_STOPS) { toast(T("tx.maxstops", { n: TX_MAX_STOPS })); return; }
  TX.stops.push("");
  haptic();
  renderRoute();
  const rows = document.querySelectorAll("#txRoute .rrow input");
  if (rows.length > 1) rows[rows.length - 2].focus();
}
function txDelStop(n) { TX.stops.splice(n, 1); haptic(); renderRoute(); }

function txSwap() {
  [TX.from, TX.to] = [TX.to, TX.from];
  TX.stops.reverse();
  haptic();
  renderRoute();
}

/* Marshrut bloki alohida chiziladi — to'xtash joyi qo'shilganda butun sahifa qayta chizilmasin */
function renderRoute() {
  const el = $("txRoute");
  if (!el) return;
  const row = (mark, inner) => `<div class="rrow"><i class="mk ${mark}"></i>${inner}</div>`;
  el.innerHTML = `
    <div class="route">
      <div class="rows">
        ${row("a", `<input id="txFrom" placeholder="${esc(T("tx.from"))}" autocomplete="off" spellcheck="false"
                 value="${esc(TX.from)}" oninput="txSet('from',this.value)">`)}
        ${TX.stops.map((v, n) => row("m",
          `<input placeholder="${esc(T("tx.stop"))}${TX.stops.length > 1 ? " " + (n + 1) : ""}"
                  autocomplete="off" spellcheck="false" value="${esc(v)}" oninput="txSetStop(${n},this.value)">
           <button class="rm" onclick="txDelStop(${n})" aria-label="${esc(T("a.del"))}">×</button>`)).join("")}
        ${row("b", `<input id="txTo" placeholder="${esc(T("tx.to"))}" autocomplete="off" spellcheck="false"
                 value="${esc(TX.to)}" oninput="txSet('to',this.value)">`)}
        ${TX.stops.length < TX_MAX_STOPS
          ? `<button class="addstop" onclick="txAddStop()">${icon("plus", 13)} ${esc(T("tx.addstop"))}</button>` : ""}
      </div>
      <button class="swap" onclick="txSwap()" aria-label="${esc(T("a.swap"))}">${icon("swap", 18)}</button>
    </div>`;
}

const dmy = (iso) => {
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : String(iso || "");
};

function txText() {
  const out = [T("tx.m.hi")];
  out.push(T("tx.m.from") + ": " + TX.from.trim());
  const stops = TX.stops.map((x) => String(x || "").trim()).filter(Boolean);
  stops.forEach((x, n) => out.push(T("tx.m.stop") + (stops.length > 1 ? " " + (n + 1) : "") + ": " + x));
  out.push(T("tx.m.to") + ": " + TX.to.trim());
  if (TX.date || TX.time) {
    out.push(T("tx.m.when") + ": " + [dmy(TX.date), TX.time].filter(Boolean).join(", "));
  }
  out.push(T("tx.m.pax") + ": " + (TX.pax || "1"));
  if (Number(TX.bags)) out.push(T("tx.m.bags") + ": " + TX.bags);
  if (TX.note.trim()) out.push(T("tx.m.note") + ": " + TX.note.trim());
  return out.join("\n");
}

function txReady() {
  if (TX.from.trim() && TX.to.trim()) return true;
  toast(T("tx.fill"));
  haptic("heavy");
  const el = TX.from.trim() ? $("txTo") : $("txFrom");

/* ============================================================ PAROL ============================================================ */
const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const bytesToB64 = (bytes) => {
  let bin = "";
  bytes.forEach((b) => (bin += String.fromCharCode(b)));
  return btoa(bin);
};

async function derive(password, saltB64, iterations) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64ToBytes(saltB64), iterations, hash: "SHA-256" }, key, 256);
  return bytesToB64(new Uint8Array(bits));
}

async function makeHash(password) {
  const salt = bytesToB64(crypto.getRandomValues(new Uint8Array(16)));
  const iterations = 200000;
  return { salt, iterations, hash: await derive(password, salt, iterations) };
}

async function checkPassword(login, password) {
  if (String(login).trim().toLowerCase() !== String(ADMIN.login || "").toLowerCase()) return false;
  try { return (await derive(password, ADMIN.salt, ADMIN.iterations)) === ADMIN.hash; }
  catch { return false; }
}

function compress(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const max = 1280;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL("image/jpeg", 0.78));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================================================ GITHUB'GA YOZISH ============================================================ */
const ghUrl = (path) => `https://api.github.com/repos/${CONFIG.github.owner}/${CONFIG.github.repo}/contents/${path}`;
const ghHeaders = () => ({ Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json" });

/* Faylning eng so'nggi versiyasi. If-None-Match qo'yilmaydi: GitHub 304 qaytarib, sha yo'qoladi. */
async function ghSha(path) {
  const q = "?ref=" + encodeURIComponent(CONFIG.github.branch) + "&_=" + Date.now();
  try {
    const res = await fetch(ghUrl(path) + q, { headers: ghHeaders(), cache: "no-store" });
    if (res.ok) { const j = await res.json(); if (j && j.sha) return j.sha; }
    if (res.status === 404) return undefined;
  } catch {}
  try {
    const dir = path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
    const res = await fetch(ghUrl(dir) + q, { headers: ghHeaders(), cache: "no-store" });
    if (res.ok) {
      const list = await res.json();
      if (Array.isArray(list)) { const hit = list.find((f) => f && f.path === path); if (hit) return hit.sha; }
    }
  } catch {}
  return undefined;
}

async function ghPut(path, base64, message) {
  let lastErr = "";
  for (let attempt = 1; attempt <= 4; attempt++) {
    const sha = await ghSha(path);
    const res = await fetch(ghUrl(path), {
      method: "PUT", headers: ghHeaders(),
      body: JSON.stringify({ message, content: base64, branch: CONFIG.github.branch, ...(sha ? { sha } : {}) }),
    });
    if (res.ok) return res.json();
    let detail = "";
    try { detail = (await res.json()).message || ""; } catch {}
    lastErr = res.status + " " + detail;
    if (res.status === 409 || res.status === 422) { await new Promise((r) => setTimeout(r, 900 * attempt)); continue; }
    throw new Error(lastErr);
  }
  throw new Error(lastErr);
}

function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < bytes.length; i += CHUNK) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  return btoa(bin);
}

/* Fayl nomi lotin harflarida bo'lsin */
const TRANSLIT = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"j",з:"z",и:"i",й:"y",к:"k",л:"l",м:"m",н:"n",
  о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"c",ч:"ch",ш:"sh",щ:"sch",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya",
  ў:"o",қ:"q",ғ:"g",ҳ:"h","'":"" };
const slug = (s) => String(s || "").toLowerCase()
  .replace(/[а-яёўқғҳ']/g, (c) => TRANSLIT[c] ?? "")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24).replace(/-+$/, "") || "photo";

function normalize(it) {
  return {
    id: Number(it.id),
    kind: it.kind === "realty" ? "realty" : "product",
    title: String(it.title || "").trim(),
    description: String(it.description || "").trim(),
    price: Number(it.price) || 0,
    category: String(it.category || "").trim(),
    district: String(it.district || "").trim(),
    rooms: String(it.rooms || "").trim(),
    area: it.area === "" || it.area == null ? null : Number(it.area),
    floor: String(it.floor || "").trim(),
    furnished: it.furnished ? 1 : 0,
    ...Object.fromEntries(EXTRA.map((f) => [f.key, f.type === "num"
      ? (it[f.key] === "" || it[f.key] == null ? null : Number(it[f.key]))
      : String(it[f.key] || "").trim()])),
    ...Object.fromEntries(AMEN.filter((a) => a.key !== "furnished").map((a) => [a.key, it[a.key] ? 1 : 0])),
    currency: CURRENCIES.includes(it.currency) ? it.currency : "TL",
    rentType: RENT[it.rentType] ? it.rentType : "oylik",
    rates: String(it.rates || "").trim(),
    mapUrl: String(it.mapUrl || "").trim(),
    contact: String(it.contact || "").trim().replace(/^@/, ""),
    images: (Array.isArray(it.images) ? it.images : []).filter(Boolean),
    hidden: it.hidden ? 1 : 0,
    ...normalizeRu(it.ru),
  };
}

/* Faqat to'ldirilgan ruscha maydonlar saqlanadi — catalog.json ortiqcha shishmasin */
function normalizeRu(ru) {
  if (!ru || typeof ru !== "object") return {};
  const out = {};
  RU_FIELDS.forEach((f) => {
    const v = String(ru[f.key] ?? "").trim();
    if (v) out[f.key] = v;
  });
  return Object.keys(out).length ? { ru: out } : {};
}

async function adminSave() {
  ensureDraft();
  const btn = $("saveBtn");
  const done = (label) => { btn.disabled = false; btn.textContent = label; };
  btn.disabled = true; btn.textContent = "Saqlanmoqda…";
  try {
    if (!token) throw new Error("nokey");

    let nextAdmin = { ...ADMIN, login: String(draftAdmin.login || "").trim() || ADMIN.login };
    if (draftAdmin.password || draftAdmin.repeat) {
      if (draftAdmin.password !== draftAdmin.repeat) throw new Error("mismatch");
      if (draftAdmin.password.length < 6) throw new Error("short");
      nextAdmin = { login: nextAdmin.login, ...(await makeHash(draftAdmin.password)) };
    }

    const promo = normPromo(draftSettings.promo);
    const promoData = String(promo.photo).match(/^data:image\/(jpeg|jpg|png|webp);base64,(.+)$/);
    if (promoData) {
      btn.textContent = "Reklama surati yuklanmoqda…";
      const ext = promoData[1] === "jpeg" ? "jpg" : promoData[1];
      const name = `${CONFIG.github.photos}/promo-${Date.now()}.${ext}`;
      await ghPut(name, promoData[2], "photo: " + name);
      promo.photo = name;
    }

    let uploaded = 0;
    for (const it of draft) {
      const images = Array.isArray(it.images) ? it.images : (it.images = []);
      for (let n = 0; n < images.length; n++) {
        const m = String(images[n]).match(/^data:image\/(jpeg|jpg|png|webp);base64,(.+)$/);
        if (!m) continue;
        const ext = m[1] === "jpeg" ? "jpg" : m[1];
        const name = `${CONFIG.github.photos}/${it.id}-${slug(it.title)}-${Date.now()}-${n}.${ext}`;
        btn.textContent = `Surat yuklanmoqda ${++uploaded}…`;
        await ghPut(name, m[2], "photo: " + name);
        images[n] = name;
      }
    }

    btn.textContent = "Katalog saqlanmoqda…";
    const payload = {
      settings: {
        title: String(draftSettings.title || "").trim() || "Qulay Market",
        contact: String(draftSettings.contact || "").trim().replace(/^@/, ""),
        phone: String(draftSettings.phone || "").trim(),
        transfer: normTransfer(draftSettings.transfer),
        promo,
      },
      admin: nextAdmin,
      items: draft.map(normalize),
    };
    await ghPut(CONFIG.github.catalog, toBase64(JSON.stringify(payload, null, 2)), "katalog yangilandi");

    SETTINGS = payload.settings;
    ADMIN = payload.admin;
    ITEMS = payload.items.map(normalize);
    draft = null; draftSettings = null; draftAdmin = null;
    applySettings(); renderAdmin(); renderList(); renderFavBadge();
    if (page === "taxi") renderTaxi();
    toast("GitHub'ga saqlandi");
    haptic("medium");
  } catch (e) {
    const raw = String((e && e.message) || e);
    let msg;
    if (raw === "nokey") msg = "Avval GitHub kalitini kiriting";
    else if (raw === "mismatch") msg = "Parollar mos kelmadi";
    else if (raw === "short") msg = "Parol kamida 6 ta belgidan iborat bo'lsin";
    else if (/401|Bad credentials/i.test(raw)) msg = "Kalit noto'g'ri yoki muddati o'tgan";
    else if (/403|Resource not accessible/i.test(raw)) msg = "Kalitda yozish huquqi yo'q (Contents: Read and write)";
    else if (/404|Not Found/i.test(raw)) msg = "Repozitoriy topilmadi — kalit " + CONFIG.github.repo + " ga ruxsatli ekanini tekshiring";
    else if (/409|does not match/i.test(raw)) msg = "Katalog boshqa oynada o'zgardi. Sahifani yangilab, qaytadan urinib ko'ring";
    else if (/422|sha/i.test(raw)) msg = "GitHub fayl versiyasini bermadi. Kalit ruxsatini tekshiring";
    else msg = "Saqlab bo'lmadi";
    toast(msg);
    haptic("heavy");
  } finally {
    done("Hammasini saqlash");
  }
}

    ? `<i>${esc(parts[0])}</i> ${esc(parts.slice(1).join(" "))}`

}

async function loadCatalog() {
  try {
    const res = await fetch("catalog.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      const items = Array.isArray(data) ? data : data.items;
      if (Array.isArray(items)) ITEMS = items.map(normalize);
      if (data && data.settings) SETTINGS = { ...SETTINGS, ...data.settings };
      if (data && data.admin && data.admin.hash) ADMIN = data.admin;
    }
  } catch {}
  loaded = true;
  applySettings();
  renderFavBadge();
  if (page === "realty" || page === "product") renderList();
  if (page === "taxi") renderTaxi();
  if (page === "fav") renderFavs();
  if (page === "item") renderItem();
  if (page === "admin" && !unlocked) renderAdmin();
}
